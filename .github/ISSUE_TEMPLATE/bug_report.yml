name: Bug report
description: Report a reproducible problem with the SaaS Metrics Dashboard
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SaaS Metrics Dashboard.
        Please do not report security vulnerabilities here. See SECURITY.md instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open...
        2. Enter...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 19, etc.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / operating system
      placeholder: Windows 11, macOS, Android, iOS, etc.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, console errors, or other useful details. Do not include secrets or private business data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
